name: Build IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: List project schemes
        run: |
          xcodebuild -workspace LocationTool.xcworkspace -list

      - name: Build archive (unsigned)
        run: |
          xcodebuild -workspace LocationTool.xcworkspace \
            -scheme LocationTool \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LocationTool.xcarchive \
            clean archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Ad-hoc sign with entitlements (for TrollStore)
        run: |
          # ad-hoc 签名把 LocationTool.entitlements 嵌入到 .app 内
          # TrollStore 安装时会读取这些 entitlement，让 CLSimulationManager 私有 API 生效
          codesign -f -s - --entitlements LocationTool/LocationTool.entitlements --generate-entitlement-der \
            build/LocationTool.xcarchive/Products/Applications/LocationTool.app
          codesign -d --entitlements - build/LocationTool.xcarchive/Products/Applications/LocationTool.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/LocationTool.xcarchive/Products/Applications/LocationTool.app Payload/
          zip -qry LocationTool.ipa Payload
          ls -lh LocationTool.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocationTool-ipa
          path: LocationTool.ipa
          retention-days: 30
