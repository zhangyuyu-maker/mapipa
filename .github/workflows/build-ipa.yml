name: Build IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: List project schemes
        run: |
          xcodebuild -workspace LocationTool.xcworkspace -list

      - name: Build archive (unsigned)
        run: |
          xcodebuild -workspace LocationTool.xcworkspace \
            -scheme LocationTool \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LocationTool.xcarchive \
            clean archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Ad-hoc sign with entitlements (for TrollStore)
        run: |
          # 安装 ldid (TrollStore 生态专用签名工具, 比 codesign 更适合注入平台级 entitlement)
          # codesign 注入 platform-application / no-sandbox 等私有 entitlement 时不会真正生效,
          # 必须用 ldid 才能让 TrollStore 识别这些权限, CLSimulationManager 才能真正改全局定位
          brew install ldid
          # 去掉 xcodebuild 留下的旧签名
          codesign --remove build/LocationTool.xcarchive/Products/Applications/LocationTool.app || true
          rm -rf build/LocationTool.xcarchive/Products/Applications/LocationTool.app/_CodeSignature || true
          # ldid 注入完整 TrollStore 平台级 entitlement
          ldid -SLocationTool/LocationTool.entitlements build/LocationTool.xcarchive/Products/Applications/LocationTool.app
          # 校验
          ldid -d build/LocationTool.xcarchive/Products/Applications/LocationTool.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/LocationTool.xcarchive/Products/Applications/LocationTool.app Payload/
          zip -qry LocationTool.ipa Payload
          ls -lh LocationTool.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocationTool-ipa
          path: LocationTool.ipa
          retention-days: 30
