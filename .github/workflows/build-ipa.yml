name: Build IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build archive (unsigned)
        run: |
          xcodebuild -workspace LocationTool.xcworkspace \
            -scheme LocationTool \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LocationTool.xcarchive \
            clean archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/LocationTool.xcarchive/Products/Applications/LocationTool.app Payload/
          zip -qry LocationTool.ipa Payload
          ls -lh LocationTool.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocationTool-ipa
          path: LocationTool.ipa
          retention-days: 30
